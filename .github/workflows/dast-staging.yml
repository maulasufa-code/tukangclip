name: dast-staging
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Guard staging only
        run: |
          TARGET="${{ secrets.STAGING_URL }}"
          if [ -z "$TARGET" ]; then echo "STAGING_URL belum diisi"; exit 1; fi
          case "$TARGET" in
            *prod*|*tukangclip.com|*vercel.app) echo "DILARANG: target looks like production"; exit 1;;
          esac
          case "$TARGET" in
            *staging*|*localhost*|*127.0.0.1*) echo "target ok: staging";;
            *) echo "DILARANG: host bukan staging yang dikenal"; exit 1;;
          esac
      - uses: actions/checkout@v4
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_URL }}
          # Ganti langkah ini dengan perintah Strix bila sudah siap:
          # run: strix scan ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: report_html.html
